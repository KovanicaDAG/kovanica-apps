name: android-ci

on:
  pull_request:
    paths:
      - 'android-wallet/**'
      - 'android-chain/**'
      - '.github/workflows/android-ci.yml'
  push:
    branches: [main]
    paths:
      - 'android-wallet/**'
      - 'android-chain/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Native symbols & Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout wallet repository
        uses: actions/checkout@v4

      - name: Checkout kovanica core repository
        uses: actions/checkout@v4
        with:
          repository: KovanicaDAG/kovanica
          path: kovanica-core

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Build arm64-v8a native library (16 KB aligned)
        run: |
          mkdir -p android-wallet/app/src/main/jniLibs/arm64-v8a
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cd kovanica-core
          rustup target add aarch64-linux-android
          cargo build --target aarch64-linux-android --release -p kovanica-light-ffi
          cp target/aarch64-linux-android/release/libkovanica_light_ffi.so ../android-wallet/app/src/main/jniLibs/arm64-v8a/

      - name: Run native symbols check and unit tests
        working-directory: android-wallet
        run: |
          chmod +x gradlew
          ./gradlew checkNativeSymbols --no-daemon
          ./gradlew testDebugUnitTest --no-daemon
