name: android-release

# Two jobs:
#   verify  - unsigned debug build on PRs/branch pushes; proves the Gradle graph,
#             the arm64 native library and the app sources still build.
#   release - signed release APK + AAB, only on workflow_dispatch or an
#             `android-v*` tag. Needs the four signing secrets listed in
#             docs/android-release-build.md. Uploads artifacts only; it does not
#             create or modify GitHub Releases.
on:
  pull_request:
    paths:
      - 'android-wallet/**'
      - 'android-comms/**'
      - 'android-chain/**'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    tags: ['android-v*']
    paths:
      - 'android-wallet/**'
      - 'android-comms/**'
      - 'android-chain/**'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.app }} (debug)
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: wallet
            dir: android-wallet
            native: true
          - app: comms
            dir: android-comms
            native: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        if: matrix.native
        with:
          repository: KovanicaDAG/kovanica
          path: kovanica-core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.native
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        if: matrix.native
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Build arm64-v8a native library (16 KB aligned)
        if: matrix.native
        run: |
          mkdir -p ${{ matrix.dir }}/app/src/main/jniLibs/arm64-v8a
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cd kovanica-core
          rustup target add aarch64-linux-android
          cargo build --target aarch64-linux-android --release -p kovanica-light-ffi
          cp target/aarch64-linux-android/release/libkovanica_light_ffi.so ../${{ matrix.dir }}/app/src/main/jniLibs/arm64-v8a/

      - name: Assemble debug APK (unsigned)
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ matrix.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release ${{ matrix.app }} (signed)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/android-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: wallet
            dir: android-wallet
            artifact: Kovanica-Wallet
            native: true
          - app: comms
            dir: android-comms
            artifact: kovanica-comms
            native: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        if: matrix.native
        with:
          repository: KovanicaDAG/kovanica
          path: kovanica-core

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.native
        with:
          targets: aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        if: matrix.native
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Build arm64-v8a native library (16 KB aligned)
        if: matrix.native
        run: |
          mkdir -p ${{ matrix.dir }}/app/src/main/jniLibs/arm64-v8a
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cd kovanica-core
          rustup target add aarch64-linux-android
          cargo build --target aarch64-linux-android --release -p kovanica-light-ffi
          cp target/aarch64-linux-android/release/libkovanica_light_ffi.so ../${{ matrix.dir }}/app/src/main/jniLibs/arm64-v8a/

      - name: Load signing material from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name — see docs/android-release-build.md"
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/release-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble signed release APK and AAB
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Verify APK signature
        working-directory: ${{ matrix.dir }}
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::expected signed $APK"; exit 1; }
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Collect versioned artifacts
        working-directory: ${{ matrix.dir }}
        run: |
          set -eu
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          mkdir -p "$RUNNER_TEMP/out"
          if [ "${{ matrix.app }}" = "wallet" ]; then
            APK_NAME="${{ matrix.artifact }}-${VERSION}-arm64-v8a.apk"
            AAB_NAME="${{ matrix.artifact }}-${VERSION}.aab"
          else
            APK_NAME="${{ matrix.artifact }}-${VERSION}.apk"
            AAB_NAME="${{ matrix.artifact }}-${VERSION}.aab"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/$APK_NAME"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/$AAB_NAME"
          ls -l "$RUNNER_TEMP/out"

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.jks"
