name: node-desktop

# Linux supervisor gates. These compile and test the app. They do not start a
# physical desktop session and they do not run a kovanica-node process.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: node-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: frontend, library, GUI
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: GUI system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget

      - name: Frontend clean install, tests, lint, build
        working-directory: node-desktop
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Rust fmt, locked library tests, strict clippy, GUI build and reaper
        working-directory: node-desktop
        run: |
          set -euo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-default-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib --no-default-features -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features gui --bins --tests -- -D warnings
          cargo build --manifest-path src-tauri/Cargo.toml --locked --features gui --bins
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features gui --test reaper_cli

  debian12-deb:
    name: Debian 12 deb
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The bookworm image's /bin/sh is dash, which rejects `set -o pipefail`.
    defaults:
      run:
        shell: bash
    container:
      # debian:bookworm linux/amd64 image manifest, not the multi-arch index.
      # Resolved 2026-11-07 from registry-1.docker.io library/debian tag bookworm.
      # Image history: debian.sh --arch amd64 out/ bookworm (created 2026-11-04).
      # Index digest for that tag: sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8
      image: debian:bookworm@sha256:366a6da5efcceffbaa19c560a101b97b87a1a9664eeeac8bc3d24395ddbf14f3
    steps:
      - name: Packages needed before checkout
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Debian 12 GUI and bundle packages
        run: |
          set -euo pipefail
          apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            wget

      - name: Build the deb and print checksums
        working-directory: node-desktop
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run lint
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib --no-default-features
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --lib --no-default-features -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features gui --bins --tests -- -D warnings
          cargo build --manifest-path src-tauri/Cargo.toml --locked --features gui --bins
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features gui --test reaper_cli
          npm run tauri -- build --bundles deb --ci -f gui -- --locked
          bash scripts/check-deb.sh
          # The package stays in the runner workspace and is discarded with the job.
          # Do not upload it and do not start kovanica-node.
