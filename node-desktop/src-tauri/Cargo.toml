[package]
name = "kovanica-node-desktop"
version = "0.2.0"
description = "Kovanica Node Linux supervisor (milestone 1)"
authors = ["Kovanica Team"]
edition = "2021"
license = "GPL-3.0-or-later"

# Standalone app workspace. This crate must build from a fresh apps checkout
# with no sibling L1 tree.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
libc = "0.2"
tauri = { version = "2", optional = true }

[features]
default = ["gui"]
gui = ["dep:tauri"]

[[bin]]
name = "kovanica-node-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dev-dependencies]
tempfile = "3"
